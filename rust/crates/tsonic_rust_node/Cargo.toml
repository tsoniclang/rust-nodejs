[package]
name = "tsonic_rust_node"
version = "0.1.0"
edition = "2021"

[dependencies]
aes-gcm = "0.10"
brotli = "7"
flate2 = "1"
filetime = "0.2"
get_if_addrs = "0.5"
glob = "0.3"
hmac = "0.12"
memchr = "=2.8.3"
mio = { version = "=1.2.1", features = ["os-poll", "net"] }
libc = "0.2"
lazy_static = { version = "=1.4.0", default-features = false, features = ["spin_no_std"] }
notify = "8"
md-5 = "0.10"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "http2"] }
rsa = { version = "0.9", features = ["sha2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
sha1 = "0.10"
tsonic_rust_js = "=0.1.0"
tsonic_rust_runtime = "=0.1.0"
webpki-roots = "1"

[target.'cfg(unix)'.dependencies]
command-fds = "=0.3.3"
signal-hook = "=0.3.18"
nix = { version = "=0.31.3", default-features = false, features = ["resource", "signal", "user"] }

[[test]]
name = "no_forbidden_shortcuts"
path = "../../tests/architecture/no_forbidden_shortcuts.rs"

[[test]]
name = "public_api_references"
path = "../../tests/architecture/public_api_references.rs"

[[test]]
name = "node_integration_tests"
path = "../../tests/node_integration_tests.rs"

[[test]]
name = "process_cpu_tests"
path = "../../tests/node/process_cpu_tests.rs"

[[test]]
name = "timer_ownership_tests"
path = "../../tests/node/timer_ownership_tests.rs"

[[test]]
name = "native_numeric_results"
path = "../../tests/node/native_numeric_results.rs"

[[test]]
name = "abi_ledger_tests"
path = "../../tests/abi_ledger_tests.rs"

[[test]]
name = "generated_shape_tests"
path = "../../tests/generated_shape_tests.rs"

[[test]]
name = "node_api_inventory_tests"
path = "../../tests/node_api_inventory_tests.rs"

[[test]]
name = "node_full_api_inventory_tests"
path = "../../tests/node_full_api_inventory_tests.rs"
